  :root {
    --navy: #0b1a3a;
    --blue-deep: #16327a;
    --blue: #2563eb;
    --amber: #f5a623;
    --amber-dim: #c9861a;
    --ink: #f3f7ff;
    --ink-secondary: #c3d3f5;
    --grid-line: rgba(243, 247, 255, 0.06);
    --grid-cell: rgba(243, 247, 255, 0.05);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: var(--navy);
  }

  body {
    position: relative;
    font-family: 'Source Sans 3', sans-serif;
  }

  canvas#bg {
    position: absolute;
    inset: 0;
    width: 1024px;
    height: 500px;
    display: block;
  }

  .stage {
    position: relative;
    width: 1024px;
    height: 500px;
    display: grid;
    grid-template-columns: 380px 1fr;
    align-items: center;
  }

  .icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-card {
    width: 216px;
    height: 216px;
    border-radius: 46px;
    background: linear-gradient(155deg, #3b7bff 0%, var(--blue) 55%, var(--blue-deep) 100%);
    box-shadow:
      0 18px 40px rgba(3, 10, 30, 0.55),
      0 2px 0 rgba(255, 255, 255, 0.12) inset,
      0 -14px 30px rgba(0, 0, 0, 0.18) inset;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-card img {
    width: 150px;
    height: 150px;
    display: block;
  }

  .copy {
    padding-right: 56px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .eyebrow {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    text-wrap: balance;
  }

  h1 {
    margin: 0;
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.04;
    color: var(--ink);
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  p.tagline {
    margin: 0;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 25px;
    line-height: 1.35;
    color: var(--ink-secondary);
    max-width: 30ch;
    text-wrap: balance;
  }
</style>

  <div class="stage">

    <div class="copy">
      <div class="eyebrow">Unofficial &mdash; private, accurate &amp; free</div>
      <h1>UK State Pension<br />Calendar</h1>
      <p class="tagline">Find your State Pension age and see every payment date on your calendar.</p>
    </div>
  </div>

  <script>
    // Calendar-grid motif: a faint field of real-looking date cells (a
    // header band + date numeral, like an actual month grid), with two
    // "payment day" cells picked out in amber for the app's core act of
    // marking payment days.
    const c = document.getElementById('bg');
    const ctx = c.getContext('2d');

    const bgGrad = ctx.createLinearGradient(0, 0, 1024, 500);
    bgGrad.addColorStop(0, '#132a63');
    bgGrad.addColorStop(0.55, '#0f2151');
    bgGrad.addColorStop(1, '#0a1533');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1024, 500);

    const glow = ctx.createRadialGradient(190, 250, 20, 190, 250, 340);
    glow.addColorStop(0, 'rgba(59, 123, 255, 0.35)');
    glow.addColorStop(1, 'rgba(59, 123, 255, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, 1024, 500);

    const cell = 46;
    const gap = 10;
    const step = cell + gap;
    const cols = Math.ceil(1024 / step) + 1;
    const rows = Math.ceil(500 / step) + 1;
    const offsetX = -18;
    const offsetY = -20;
    const headerH = 13;

    // Highlighted "payment day" cells (col, row), chosen to sit in the
    // right-hand copy field, away from the icon and text baselines. Dates
    // are 28 days apart (3rd -> 31st) to match the app's default 4-weekly
    // payment cycle.
    const highlights = new Map([
      ['11,1', 3],
      ['14,4', 31],
    ]);

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawCell(col, row) {
      const x = offsetX + col * step;
      const y = offsetY + row * step;
      const key = col + ',' + row;
      const isHi = highlights.has(key);
      const dateNum = isHi ? highlights.get(key) : ((col * 3 + row * 7) % 30) + 1;

      ctx.save();
      roundRect(ctx, x, y, cell, cell, 10);
      ctx.clip();

      ctx.fillStyle = isHi ? 'rgba(245, 166, 35, 0.9)' : 'rgba(243, 247, 255, 0.055)';
      ctx.fillRect(x, y, cell, cell);

      // Header band separates a "weekday" strip from the date number,
      // the way a real calendar day cell reads at a glance.
      ctx.fillStyle = isHi ? 'rgba(11, 26, 58, 0.16)' : 'rgba(243, 247, 255, 0.05)';
      ctx.fillRect(x, y, cell, headerH);
      ctx.restore();

      ctx.font = isHi ? '700 15px "Source Sans 3", sans-serif' : '600 12px "Source Sans 3", sans-serif';
      ctx.fillStyle = isHi ? 'rgba(11, 26, 58, 0.92)' : 'rgba(243, 247, 255, 0.16)';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'right';
      ctx.fillText(String(dateNum), x + cell - 7, y + cell - 8);

      if (isHi) {
        ctx.beginPath();
        ctx.arc(x + 11, y + cell - 10, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(11, 26, 58, 0.85)';
        ctx.fill();
      }
    }

    function draw() {
      for (let r = 0; r < rows; r++) {
        for (let col = 0; col < cols; col++) {
          drawCell(col, r);
        }
      }
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(draw).catch(draw);
    } else {
      draw();
    }
  </script>
